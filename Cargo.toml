[package]
name = "tjcli"
version = "0.1.2"
edition = "2024"

authors = ["Justice Sam <fjaccobian@gmail.com>"]
description = "A lightning-fast CLI scaffolding tool to instantly generate Spring Boot 4 + Thymeleaf + Tailwind CSS v4 + Vite + TypeScript projects."
repository = "https://github.com"
license = "MIT"
readme = "README.md"
keywords = ["spring-boot", "thymeleaf", "tailwind", "vite", "scaffold"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
dialoguer = "0.12.0"
tempfile = "3.27.0"
